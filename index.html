<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Geopolis — Under Maintenance</title>
  <meta
    name="description"
    content="Geopolis is temporarily under maintenance. Please check back later."
  />
  <style>
    :root {
      --bg: #f5f7fb;
      --card: #ffffff;
      --text: #1f2937;
      --muted: #6b7280;
      --accent: #0f766e;
      --border: #dbe3ea;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 24px;
      font-family: Arial, sans-serif;
      background: linear-gradient(180deg, #eef4f7 0%, var(--bg) 100%);
      color: var(--text);
    }

    .card {
      width: 100%;
      max-width: 720px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 40px 28px;
      box-shadow: 0 10px 30px rgba(15, 23, 42, 0.08);
      text-align: center;
    }

    .badge {
      display: inline-block;
      margin-bottom: 16px;
      padding: 8px 14px;
      border-radius: 999px;
      background: #dff4f1;
      color: var(--accent);
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 14px;
      font-size: clamp(2rem, 4vw, 3.2rem);
      line-height: 1.1;
    }

    p {
      margin: 0 auto 14px;
      max-width: 56ch;
      font-size: 1.05rem;
      line-height: 1.7;
      color: var(--muted);
    }

    .note {
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid var(--border);
      font-size: 0.98rem;
    }

    a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 600;
    }

    a:hover {
      text-decoration: underline;
    }

    footer {
      margin-top: 22px;
      font-size: 0.92rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="badge">Maintenance Notice</div>
    <h1>Geopolis is currently under maintenance</h1>
    <p>
      Our website is temporarily unavailable while we carry out updates and improvements.
    </p>
    <p>
      Please check back later. We appreciate your patience and understanding.
    </p>

    <div class="note">
      <p>
        For urgent queries, contact:
        <a href="mailto:geopolissociety@gmail.com">geopolissociety@gmail.com</a>
      </p>
    </div>

    <footer>
      © Geopolis
    </footer>
  </main>
</body>
</html>
